name: Map D LV27 attribution read-only probe
on:
  push:
    branches: [qa/mapd-lv27-attribution-readonly-20261020]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless test browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Observe public registration entry and query retention without selecting booths
        run: node scripts/qa-mapd-attribution-readonly.mjs
