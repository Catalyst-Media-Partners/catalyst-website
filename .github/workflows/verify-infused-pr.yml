name: INFUSED website pull-request validation

on:
  pull_request:
    branches: [infused-show]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate site source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build all INFUSED site pages
        run: npm run build
      - name: Validate navigation, pricing, event details and assets
        run: npm run check
      - name: Test INFUSED ticket notification, verification and unsubscribe with mock email
        run: npm run test:w02
      - name: Verify responsive layout at 320px through 2560px in Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          node scripts/verify-responsive.mjs
      - name: Browser-test campaign-to-CTA handoff without cookies
        run: node scripts/verify-click-links.mjs
      - name: Verify INFUSED-only Worker and routing contract
        run: node scripts/verify-cloudflare.mjs
