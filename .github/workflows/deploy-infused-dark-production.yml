name: Deploy INFUSED single-site Worker

on:
  push:
    branches: [infused-show]
    paths:
      - .github/workflows/deploy-infused-dark-production.yml
      - .github/workflows/deploy-infused.yml
      - .github/workflows/deploy-infused-dark-canary.yml
      - .github/workflows/verify-infused-pr.yml
      - build.mjs
      - src/**
      - dropjourney/**
      - scripts/verify-cloudflare.mjs
      - scripts/verify-click-links.mjs
      - wrangler.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infused-single-site-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/infused-show' && github.actor == 'PASS-LH'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the single-site source of truth
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python for visual QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the light source and the unified dark/light Worker assets
        env:
          TURNSTILE_SITEKEY: '0x4AAAAAAFthzCYCdmh8aVv8'
        run: |
          set -euo pipefail
          npm run build
          npm run check
          npm run test:w02
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          node scripts/verify-click-links.mjs
          node --check dropjourney/build.mjs
          node --check dropjourney/worker.mjs
          node --check dropjourney/booth-attribution.mjs
          node --check dropjourney/intake.mjs
          node --check dropjourney/ticket-notify.mjs
          INFUSED_MODE=production TURNSTILE_SITEKEY="$TURNSTILE_SITEKEY" node dropjourney/build.mjs
          INFUSED_MODE=production node dropjourney/scripts/qa.mjs
          INFUSED_MODE=production SITE_BASE_PATH=/ SITE_HOST=dark.infused.show INTAKE_ENVIRONMENT=production INTAKE_TEST_MODE=true TURNSTILE_SITEKEY="$TURNSTILE_SITEKEY" node dropjourney/scripts/qa_native_intake.mjs
          INFUSED_MODE=production node dropjourney/scripts/qa_ticket_notify.mjs
          node dropjourney/scripts/qa_dark_worker.mjs
          node scripts/verify-cloudflare.mjs

      - name: Run responsive and interaction browser QA
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          INFUSED_MODE=production python dropjourney/scripts/visual_qa.py

      - name: Verify exact production baseline and shared services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'Missing Cloudflare API token'; exit 1; }
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/domains" > /tmp/domains-before.json
          jq -e '.success == true' /tmp/domains-before.json >/dev/null
          for hostname in infused.show www.infused.show dark.infused.show; do
            jq -e --arg host "$hostname" '([.result[]? | select(.hostname == $host and .service == "infused-dark")] | length) == 1' /tmp/domains-before.json >/dev/null
          done
          jq -e '([.result[]? | select(.hostname == "light.infused.show" and .service == "infused-show")] | length) == 1' /tmp/domains-before.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts/infused-dark/settings" > /tmp/dark-before.json
          jq -e '.success == true' /tmp/dark-before.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "INTAKE_DB" and .database_id == "4fc7440c-c340-47c4-a75f-96f4e7ad7441")] | length) == 1' /tmp/dark-before.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "INTAKE_SES" and .service == "catalyst-revenue" and .entrypoint == "InfusedIntakeSESBridge")] | length) == 1' /tmp/dark-before.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts/catalyst-revenue/settings" > /tmp/revenue-before.json
          jq -e '.success == true and any(.result.bindings[]?; .name == "DB" and .database_id == "4fc7440c-c340-47c4-a75f-96f4e7ad7441")' /tmp/revenue-before.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts/infused-show/settings" > /tmp/light-before.json
          jq -e '.success == true and any(.result.bindings[]?; .name == "AUDIENCE_DB" and .database_id == "4fc7440c-c340-47c4-a75f-96f4e7ad7441")' /tmp/light-before.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts/infused-dark/secrets" > /tmp/dark-secrets-before.json
          jq -e '.success == true and any(.result[]?; .name == "TURNSTILE_SECRET") and any(.result[]?; .name == "TURNSTILE_SECRET_PRODUCTION")' /tmp/dark-secrets-before.json >/dev/null
          echo "Verified existing public routes, canonical D1, shared SES backend, and protected Turnstile secrets."

      - name: Deploy the single INFUSED site Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: npx --yes wrangler@4.102.0 deploy --config wrangler.toml

      - name: Verify the new Worker has no light-site or booth proxy bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts/infused-dark/settings" > /tmp/dark-after.json
          jq -e '.success == true' /tmp/dark-after.json >/dev/null
          jq -e '([.result.bindings[]? | select(.type == "d1")] | length) == 1' /tmp/dark-after.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "INTAKE_DB" and .database_id == "4fc7440c-c340-47c4-a75f-96f4e7ad7441")] | length) == 1' /tmp/dark-after.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "INTAKE_SES" and .service == "catalyst-revenue" and .entrypoint == "InfusedIntakeSESBridge")] | length) == 1' /tmp/dark-after.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "LIGHT_SITE" or .name == "BOOTH_ATTRIBUTION")] | length) == 0' /tmp/dark-after.json >/dev/null
          jq -e 'any(.result.bindings[]?; .name == "ASSETS" and .type == "assets")' /tmp/dark-after.json >/dev/null
          for name in TURNSTILE_SECRET TURNSTILE_SECRET_PRODUCTION; do
            jq -e --arg name "$name" 'any(.result.bindings[]?; .name == $name and .type == "secret_text")' /tmp/dark-after.json >/dev/null
          done
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts/infused-dark/schedules" > /tmp/dark-schedules.json
          jq -e '.success == true and any(.result.schedules[]?; .cron == "*/5 * * * *")' /tmp/dark-schedules.json >/dev/null

      - name: Smoke-test dark root, embedded light landing page, and shared assets
        run: |
          set -euxo pipefail
          trap 'echo "Smoke test diagnostics"; for f in /tmp/apex-headers /tmp/lander-headers /tmp/lander-css-headers /tmp/lander-js-headers /tmp/dark-headers /tmp/www-headers; do if [[ -f "$f" ]]; then echo "$f"; head -n 20 "$f"; fi; done; if [[ -f /tmp/apex.html ]]; then echo "Homepage preview:"; head -c 200 /tmp/apex.html; fi' ERR
          curl --fail --silent --show-error --max-time 30 -D /tmp/apex-headers -o /tmp/apex.html https://infused.show/
          grep -qi '^X-DropJourney-Version: 2.9.3-single-worker' /tmp/apex-headers
          grep -q 'FROM ROOTS' /tmp/apex.html
          curl --fail --silent --show-error --max-time 30 -D /tmp/lander-headers -o /tmp/lander.html https://infused.show/lander/
          grep -q '<base href="/">' /tmp/lander.html
          grep -q 'https://infused.show/lander/' /tmp/lander.html
          grep -q 'href="/assets/css/site.css"' /tmp/lander.html
          grep -q 'src="/assets/js/cta-attribution.js"' /tmp/lander.html
          grep -qi '^X-Robots-Tag: index, follow' /tmp/lander-headers
          curl --fail --silent --show-error --max-time 30 -D /tmp/lander-css-headers -o /dev/null https://infused.show/assets/css/site.css
          grep -qi '^content-type: text/css' /tmp/lander-css-headers
          curl --fail --silent --show-error --max-time 30 -D /tmp/lander-js-headers -o /dev/null https://infused.show/assets/js/cta-attribution.js
          grep -qi '^content-type:.*javascript' /tmp/lander-js-headers
          dark_status="$(curl --silent --show-error --max-time 15 -D /tmp/dark-headers -o /dev/null -w '%{http_code}' https://dark.infused.show/)"
          [[ "$dark_status" == "200" ]] || { echo "dark alias failed: $dark_status"; exit 1; }
          grep -qi '^X-Robots-Tag: noindex, nofollow, noarchive' /tmp/dark-headers
          www_status="$(curl --silent --show-error --max-time 15 -D /tmp/www-headers -o /dev/null -w '%{http_code}' https://www.infused.show/)"
          www_location="$(awk 'tolower($1) == "location:" {gsub("\r","",$2); print $2}' /tmp/www-headers | tail -n 1)"
          [[ "$www_status" == "308" && "$www_location" == "https://infused.show/" ]] || { echo "www canonical redirect failed"; exit 1; }

      - name: Move the light hostname to the same Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/domains?hostname=light.infused.show" > /tmp/light-domain.json
          service="$(jq -r '.result[0].service // empty' /tmp/light-domain.json)"
          domain_id="$(jq -r '.result[0].id // empty' /tmp/light-domain.json)"
          if [[ "$service" == "infused-show" && -n "$domain_id" ]]; then
            curl --fail --silent --show-error --max-time 30 -X DELETE "${auth[@]}" "$base/workers/domains/$domain_id" > /tmp/light-detach.json
            jq -e '.success == true' /tmp/light-detach.json >/dev/null
            if ! curl --fail --silent --show-error --max-time 30 -X PUT "${auth[@]}" "$base/workers/domains" -H 'Content-Type: application/json' --data '{"hostname":"light.infused.show","service":"infused-dark"}' > /tmp/light-attach.json || ! jq -e '.success == true' /tmp/light-attach.json >/dev/null; then
              curl --silent --show-error --max-time 30 -X PUT "${auth[@]}" "$base/workers/domains" -H 'Content-Type: application/json' --data '{"hostname":"light.infused.show","service":"infused-show"}' > /tmp/light-rollback.json || true
              echo "Failed to move light.infused.show; attempted to restore its previous Worker assignment" >&2
              exit 1
            fi
          elif [[ "$service" != "infused-dark" ]]; then
            echo "Unexpected light hostname service: $service" >&2
            exit 1
          fi
          light_status="$(curl --silent --show-error --max-time 20 -D /tmp/light-host-headers -o /dev/null -w '%{http_code}' https://light.infused.show/ || true)"
          light_location="$(awk 'tolower($1) == "location:" {gsub("\r","",$2); print $2}' /tmp/light-host-headers | tail -n 1)"
          [[ "$light_status" == "308" && "$light_location" == "https://infused.show/lander/" ]] || { echo "light hostname redirect failed"; exit 1; }

      - name: Retire the old light Worker and verify one public site Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl --fail --silent --show-error --max-time 30 -X DELETE "${auth[@]}" "$base/workers/scripts/infused-show" > /tmp/old-worker-delete.json
          jq -e '.success == true' /tmp/old-worker-delete.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts" > /tmp/workers-after.json
          jq -e '.success == true and ([.result[]? | select(.id == "infused-show")] | length) == 0' /tmp/workers-after.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/domains" > /tmp/domains-after.json
          jq -e '.success == true' /tmp/domains-after.json >/dev/null
          for hostname in infused.show www.infused.show dark.infused.show light.infused.show; do
            jq -e --arg host "$hostname" '([.result[]? | select(.hostname == $host and .service == "infused-dark")] | length) == 1' /tmp/domains-after.json >/dev/null
          done
          echo "INFUSED consolidated: one public website Worker, one canonical D1, one shared Catalyst revenue backend."
