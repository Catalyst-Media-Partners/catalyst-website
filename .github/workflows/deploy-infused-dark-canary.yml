name: INFUSED dark canary deployment

on:
  push:
    branches:
      - release/infused-dark-production-inf1-20261030
    paths:
      - .github/workflows/deploy-infused-dark-canary.yml

permissions:
  contents: read

concurrency:
  group: infused-dark-canary-deployment
  cancel-in-progress: false

jobs:
  deploy-canary:
    if: github.ref == 'refs/heads/release/infused-dark-production-inf1-20261030' && github.actor == 'PASS-LH'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the isolated INFUSED candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python for visual QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source and build the root-path canary assets
        run: |
          set -euo pipefail
          node --check dropjourney/build.mjs
          node --check dropjourney/worker.mjs
          node --check dropjourney/intake.mjs
          node --check dropjourney/ticket-notify.mjs
          node --check dropjourney/src/intake-form.mjs
          node --check dropjourney/src/intake.js
          node --check dropjourney/src/ticket-notify.js
          INFUSED_MODE=production node dropjourney/build.mjs
          INFUSED_MODE=production node dropjourney/scripts/qa.mjs
          INFUSED_MODE=production SITE_BASE_PATH=/ SITE_HOST=dark.infused.show INTAKE_ENVIRONMENT=preview INTAKE_TEST_MODE=true node dropjourney/scripts/qa_native_intake.mjs
          node dropjourney/scripts/qa_dark_worker.mjs

      - name: Run responsive and interaction browser QA
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          INFUSED_MODE=production python dropjourney/scripts/visual_qa.py

      - name: Verify deployment target and preserve current public site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'Missing Cloudflare API token'; exit 1; }
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/domains" > /tmp/domains-before.json
          jq -e '.success == true' /tmp/domains-before.json >/dev/null
          jq -e '([.result[]? | select(.hostname == "infused.show" and .service == "infused-show")] | length) == 1 and ([.result[]? | select(.hostname == "www.infused.show" and .service == "infused-show")] | length) == 1' /tmp/domains-before.json >/dev/null
          jq -e '([.result[]? | select(.hostname == "dark.infused.show" and .service == "infused-dark")] | length) == 0' /tmp/domains-before.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts/infused-show/deployments?per_page=1" > /tmp/infused-public-before.json
          jq -e '.success == true and .result.deployments[0].id == "c79682ae-15cf-420e-88d9-6dc7e8a6558e"' /tmp/infused-public-before.json >/dev/null

      - name: Deploy only the isolated infused-dark Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: npx --yes wrangler@4.102.0 deploy --config dropjourney/wrangler.dark-canary.template.toml

      - name: Verify canary bindings, no public hostname assignment, and unchanged live Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts/infused-dark/settings" > /tmp/infused-dark-settings.json
          jq -e '.success == true' /tmp/infused-dark-settings.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "INTAKE_DB" and .database_id == "13188d57-a463-445d-b341-9479ac3a4558")] | length) == 1' /tmp/infused-dark-settings.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "INTAKE_SES" and .service == "catalyst-revenue" and .entrypoint == "InfusedIntakeSESBridge")] | length) == 1' /tmp/infused-dark-settings.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "BOOTH_ATTRIBUTION" and .service == "infused-show")] | length) == 1' /tmp/infused-dark-settings.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "SITE_MODE" and .text == "canary")] | length) == 1' /tmp/infused-dark-settings.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "INTAKE_ENVIRONMENT" and .text == "preview")] | length) == 1' /tmp/infused-dark-settings.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "INTAKE_TEST_MODE" and .text == "true")] | length) == 1' /tmp/infused-dark-settings.json >/dev/null
          jq -e '([.result.bindings[]? | select(.name == "TICKET_NOTIFY_ENABLED" and .text == "false")] | length) == 1' /tmp/infused-dark-settings.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts/infused-dark/deployments?per_page=1" > /tmp/infused-dark-deployments.json
          jq -e '.success == true and (.result.deployments | length > 0) and (.result.deployments[0].versions | any(.percentage == 100))' /tmp/infused-dark-deployments.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/domains" > /tmp/domains-after.json
          jq -e '.success == true' /tmp/domains-after.json >/dev/null
          jq -e '([.result[]? | select(.hostname == "dark.infused.show" and .service == "infused-dark")] | length) == 0' /tmp/domains-after.json >/dev/null
          jq -e '([.result[]? | select(.hostname == "infused.show" and .service == "infused-show")] | length) == 1 and ([.result[]? | select(.hostname == "www.infused.show" and .service == "infused-show")] | length) == 1' /tmp/domains-after.json >/dev/null
          curl --fail --silent --show-error --max-time 30 "${auth[@]}" "$base/workers/scripts/infused-show/deployments?per_page=1" > /tmp/infused-public-after.json
          jq -e '.success == true and .result.deployments[0].id == "c79682ae-15cf-420e-88d9-6dc7e8a6558e"' /tmp/infused-public-after.json >/dev/null
          jq -r '.result.deployments[0].id' /tmp/infused-dark-deployments.json
          echo 'Canary Worker deployed without a hostname; public INFUSED Worker and domains unchanged.'
