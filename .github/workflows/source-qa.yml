name: Catalyst merchant-site source QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify merchant-approved content and build exact deployment
        run: npm run check

      - name: Compile the shared game Worker and durable object
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir /tmp/catalyst-worker-dry-run
