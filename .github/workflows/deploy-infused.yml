name: Build and deploy INFUSED standalone Worker

on:
  push:
    branches: [infused-show]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infused-show-independent-worker
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.ref == 'refs/heads/infused-show' && github.actor == 'PASS-LH'
    runs-on: ubuntu-latest
    steps:
      - name: Check out independent INFUSED branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static build and production routing logic
        run: |
          set -euo pipefail
          npm run build
          npm run check
          node scripts/verify-cloudflare.mjs
          grep -Fxq 'name = "infused-show"' wrangler.toml
          grep -Fxq 'keep_vars = true' wrangler.toml
      - name: Confirm dedicated Cloudflare target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'Missing Cloudflare token'; exit 1; }
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" > /tmp/infused-cloudflare-read.json
          jq -e '.success == true' /tmp/infused-cloudflare-read.json >/dev/null
      - name: Deploy only the independent INFUSED Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: |
          set -euo pipefail
          npx --yes wrangler@4.102.0 deploy --name infused-show
      - name: Verify Cloudflare deployed Worker and preserve Catalyst
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7fe07bc649cd7366b14ba607c115e895'
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/infused-show/deployments"
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint" > /tmp/infused-deploy.json
          jq -e '.success == true and (.result.deployments | length > 0)' /tmp/infused-deploy.json > /dev/null
          jq -r '.result.deployments[0].id' /tmp/infused-deploy.json
          echo 'INFUSED Worker deployed. No custom domain/DNS modified.'
