name = "infused-dropjourneytest"
main = "./worker.mjs"
compatibility_date = "2026-10-26"
workers_dev = false
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[d1_databases]]
binding = "INTAKE_DB"
database_name = "infused-intake"
database_id = "13188d57-a463-445d-b341-9479ac3a4558"

[[services]]
binding = "INTAKE_SES"
service = "catalyst-revenue"
entrypoint = "InfusedIntakeSESBridge"

[triggers]
crons = ["*/5 * * * *"]
