# INF-3 production template. Production D1 and environment-separated SES bridge are provisioned.
name = "infused-dark"
main = "./worker.mjs"
compatibility_date = "2026-10-26"
workers_dev = false
preview_urls = false
keep_vars = true

[assets]
directory = "./dist/production"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[d1_databases]]
binding = "INTAKE_DB"
database_name = "infused-intake-production"
database_id = "2082f84e-bacd-4ef2-8902-265eda67e4d1"

[[services]]
binding = "INTAKE_SES"
service = "catalyst-revenue"
entrypoint = "InfusedIntakeSESBridge"

[[services]]
binding = "BOOTH_ATTRIBUTION"
service = "infused-show"

[[services]]
binding = "LIGHT_SITE"
service = "infused-show"

[triggers]
crons = ["*/5 * * * *"]

[vars]
SITE_BASE_PATH = "/"
SITE_MODE = "production"
SITE_ALLOWED_HOSTS = "infused.show,dark.infused.show,www.infused.show"
INTAKE_ENVIRONMENT = "production"
INTAKE_TEST_MODE = "false"
INTAKE_CONSENT_VERSION = "infused-intake-2026-10-28-v1"
TICKET_NOTIFY_ENABLED = "false"

# TURNSTILE_SECRET_PRODUCTION must be configured as a Worker secret, never committed here.
# The production workflow assigns infused.show and www.infused.show to this Worker; light.infused.show remains a redirect to /lander/.
